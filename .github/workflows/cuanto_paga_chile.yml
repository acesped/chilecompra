
name: Cuanto Paga Chile - Instagram

on:
  workflow_dispatch:

  schedule:
    # 13:20 UTC
    # 10:20 Chile en verano
    # 09:20 Chile en invierno
    - cron: "20 13 * * *"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: cuanto-paga-chile-instagram
  cancel-in-progress: false

jobs:
  publicar:
    name: Generar y publicar en Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      # GitHub
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Datos de compras públicas
      ANIO: "2026"
      CASOS_POR_EJECUCION: "1"
      MAX_MB_DESCARGA: "45"
      MAX_REGISTROS: "15000"

      # Control de publicación
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'false' }}

      # GitHub Pages
      GH_PAGES_BASE_URL: ${{ vars.GH_PAGES_BASE_URL }}

      # Instagram API
      META_GRAPH_VERSION: "v25.0"
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

    steps:

      # =====================================
      # 1. Descargar repositorio
      # =====================================

      - name: Descargar proyecto
        uses: actions/checkout@v4

      # =====================================
      # 2. Configurar Python SIN CACHE
      # =====================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================
      # 3. Instalar dependencias
      # =====================================

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "requests>=2.32,<3" \
            "Pillow>=10,<13"

      # =====================================
      # 4. Validar archivo Python
      # =====================================

      - name: Verificar script Python
        run: |
          if [ ! -f cuanto_paga_chile.py ]; then
            echo "::error::No existe cuanto_paga_chile.py"
            exit 1
          fi

          python -m py_compile cuanto_paga_chile.py

          echo "Script Python validado correctamente"

      # =====================================
      # 5. Verificar credenciales
      # =====================================

      - name: Comprobar credenciales Instagram
        if: env.PUBLISH_ENABLED == 'true'
        run: |
          if [ -z "$IG_USER_ID" ]; then
            echo "::error::Falta IG_USER_ID"
            exit 1
          fi

          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::error::Falta INSTAGRAM_ACCESS_TOKEN"
            exit 1
          fi

          echo "Credenciales de Instagram configuradas"

      # =====================================
      # 6. Verificar GitHub Pages
      # =====================================

      - name: Verificar GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Comprobando GitHub Pages..."

          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/pages" \
            --silent; then

            echo "::error::GitHub Pages no esta habilitado."
            echo "::error::Entra a Settings > Pages."
            echo "::error::Selecciona GitHub Actions como Source."
            exit 1
          fi

          echo "GitHub Pages disponible"

      # =====================================
      # 7. Generar publicaciones
      # =====================================

      - name: Analizar compras publicas
        run: |
          python cuanto_paga_chile.py generate

      # =====================================
      # 8. Guardar vista previa
      # =====================================

      - name: Guardar imagenes generadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuanto-paga-chile-preview
          path: ${{ runner.temp }}/cuanto_paga_chile/site/
          if-no-files-found: ignore
          retention-days: 7

      # =====================================
      # 9. Configurar GitHub Pages
      # =====================================

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # =====================================
      # 10. Subir imagenes a GitHub Pages
      # =====================================

      - name: Preparar imagenes publicas
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/cuanto_paga_chile/site

      # =====================================
      # 11. Publicar imagenes en Pages
      # =====================================

      - name: Publicar imagenes en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # =====================================
      # 12. Publicar en Instagram
      # =====================================

      - name: Publicar en Instagram
        run: |
          python cuanto_paga_chile.py publish

      # =====================================
      # 13. Resumen de ejecucion
      # =====================================

      - name: Resumen de ejecucion
        if: always()
        run: |
          echo "## Cuanto Paga Chile" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Fecha UTC: $(date -u)" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Publicacion habilitada: $PUBLISH_ENABLED" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Repositorio: $GITHUB_REPOSITORY" \
            >> "$GITHUB_STEP_SUMMARY"
