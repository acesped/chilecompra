
name: Cuanto Paga Chile - Instagram (metodo Sismonauta)

on:
  workflow_dispatch:
  schedule:
    # 13:20 UTC: 10:20 Chile en verano / 09:20 en invierno
    - cron: '20 13 * * *'

# La rama instagram-media guarda las imágenes; main conserva solo el py + yml.
# El histórico y las publicaciones inciertas quedan en un GitHub Issue.
permissions:
  contents: write
  issues: write

concurrency:
  group: cuanto-paga-chile-instagram
  cancel-in-progress: false

jobs:
  publicar:
    name: Analizar adjudicaciones y publicar en Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANIO: '2026'
      CASOS_POR_EJECUCION: '1'
      MAX_MB_DESCARGA: '45'
      MAX_REGISTROS: '15000'

      # Publicación real activada.
      PUBLISH_ENABLED: 'true'

      # Se alojan imágenes JPG permanentes en una rama separada.
      IG_MEDIA_BRANCH: 'instagram-media'
      IG_GRAPH_BASE: 'https://graph.instagram.com'
      META_GRAPH_VERSION: 'v25.0'

      # Mismos GitHub Secrets de Cuánto Paga Chile (sin Facebook).
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      # Opcional: variable con el @usuario esperado para mayor seguridad.
      IG_EXPECTED_USERNAME: ${{ vars.IG_EXPECTED_USERNAME }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python (sin cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check \
            'requests>=2.32,<3' 'Pillow>=10,<13'

      - name: Verificar sintaxis del script
        run: python -m py_compile cuanto_paga_chile.py

      - name: Verificar token e identidad de Instagram ANTES de generar
        run: python cuanto_paga_chile.py check-instagram

      - name: Generar publicación desde adjudicaciones reales
        run: python cuanto_paga_chile.py generate

      - name: Guardar imagen y respaldo de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuanto-paga-chile-preview
          path: ${{ runner.temp }}/cuanto_paga_chile/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar fotografía solo en Instagram
        run: python cuanto_paga_chile.py publish

      - name: Resumen
        if: always()
        run: |
          echo '## Cuánto Paga Chile — Instagram' >> "$GITHUB_STEP_SUMMARY"
          echo "Publicación habilitada: $PUBLISH_ENABLED" >> "$GITHUB_STEP_SUMMARY"
          echo "Repositorio: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "Rama de imágenes: $IG_MEDIA_BRANCH" >> "$GITHUB_STEP_SUMMARY"
