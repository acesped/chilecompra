
name: Cuanto Paga Chile - Instagram

on:
  workflow_dispatch:

  schedule:
    # Todos los dias a las 07:00 hora de Chile
    - cron: "0 7 * * *"
      timezone: "America/Santiago"

    # Todos los dias a las 18:00 hora de Chile
    - cron: "0 18 * * *"
      timezone: "America/Santiago"

# ==========================================
# PERMISOS
# ==========================================

permissions:
  contents: write
  issues: write

# Evitar ejecuciones simultaneas
concurrency:
  group: cuanto-paga-chile-instagram
  cancel-in-progress: false

# ==========================================
# TRABAJO PRINCIPAL
# ==========================================

jobs:
  publicar:
    name: Analizar adjudicaciones y publicar en Instagram

    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # GITHUB
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # DATOS CHILECOMPRA
      ANIO: "2026"
      CASOS_POR_EJECUCION: "1"
      MAX_MB_DESCARGA: "45"
      MAX_REGISTROS: "15000"

      # PUBLICACION AUTOMATICA
      PUBLISH_ENABLED: "true"

      # ALOJAMIENTO DE IMAGENES
      IG_MEDIA_BRANCH: "instagram-media"

      # INSTAGRAM API
      IG_GRAPH_BASE: "https://graph.instagram.com"
      META_GRAPH_VERSION: "v25.0"

      IG_EXPECTED_USERNAME: "cuantopagachile"

      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

    steps:

      # 1. Descargar repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instalar dependencias
      - name: Instalar dependencias Python
        run: |
          python -m pip install --disable-pip-version-check \
            "requests>=2.32,<3" \
            "Pillow>=10,<13"

      # 4. Verificar script Python
      - name: Comprobar archivo Python
        run: |
          test -f cuanto_paga_chile.py
          python -m py_compile cuanto_paga_chile.py
          echo "Script validado correctamente"

      # 5. Comprobar configuracion
      - name: Comprobar configuracion de Instagram
        run: |
          if [ -z "$IG_USER_ID" ]; then
            echo "::error::Falta IG_USER_ID"
            exit 1
          fi

          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "::error::Falta INSTAGRAM_ACCESS_TOKEN"
            exit 1
          fi

          if [[ ! "$IG_USER_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::IG_USER_ID debe ser numerico"
            exit 1
          fi

          echo "Configuracion presente"
          echo "Cuenta: @$IG_EXPECTED_USERNAME"

      # 6. Validar token de Instagram
      - name: Verificar token e identidad de Instagram
        run: |
          python cuanto_paga_chile.py check-instagram

      # 7. Verificar acceso a GitHub
      - name: Verificar acceso al repositorio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}" \
            --jq '.full_name'

      # 8. Generar publicacion
      - name: Analizar adjudicaciones reales
        run: |
          python cuanto_paga_chile.py generate

      # 9. Guardar respaldo
      - name: Guardar imagen y respaldo de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuanto-paga-chile-preview
          path: ${{ runner.temp }}/cuanto_paga_chile/
          retention-days: 7
          if-no-files-found: ignore

      # 10. Publicar exclusivamente en Instagram
      - name: Publicar imagen en Instagram
        run: |
          python cuanto_paga_chile.py publish

      # 11. Resumen
      - name: Resumen de ejecucion
        if: always()
        run: |
          echo "## Cuánto Paga Chile" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cuenta: @$IG_EXPECTED_USERNAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publicacion: $PUBLISH_ENABLED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Año analizado: $ANIO" >> "$GITHUB_STEP_SUMMARY"
          echo "- Casos por ejecucion: $CASOS_POR_EJECUCION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Horarios: 07:00 y 18:00 (America/Santiago)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
