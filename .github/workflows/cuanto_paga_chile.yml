
name: Cuanto Paga Chile - Solo Instagram

on:
  workflow_dispatch:
  schedule:
    # 13:20 UTC: 10:20 Chile en verano;
    # 09:20 en invierno
    - cron: '20 13 * * *'

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: cuanto-paga-chile-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ANIO: '2026'
      CASOS_POR_EJECUCION: '1'
      MAX_MB_DESCARGA: '45'
      MAX_REGISTROS: '15000'

      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'false' }}
      GH_PAGES_BASE_URL: ${{ vars.GH_PAGES_BASE_URL }}

      META_GRAPH_VERSION: 'v25.0'
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check \
            'requests>=2.32,<3' \
            'Pillow>=10,<13'

      - name: Generar foto y pie con datos abiertos reales
        run: python cuanto_paga_chile.py generate

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir imágenes para Instagram
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/cuanto_paga_chile/site

      - name: Desplegar imágenes públicas
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publicar solo en Instagram
        run: python cuanto_paga_chile.py publish
